<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Babaváró buli – Tippeld meg a baba nemét</title>
<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <text y='.9em' font-size='90'>👶</text>
</svg>">
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #d6e8ff);
    min-height: 100dvh;
    overflow-y: auto;
    overscroll-behavior-y: auto;
  }
  @media (min-width: 901px) {
  .wrapper {
    height: 100vh;
    align-items: stretch;
  }

  .box {
    height: 100%;
  }
}


  /* TELJES OLDAL */
  .wrapper {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 30px;
    width: 100vw;
    padding: 30px;
  }

  @media (min-width: 901px) {
    .counts {
      margin-top: 60px;
    }
  }

  /* BOXOK */
  .box {
    background: white;
    border-radius: 30px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    overflow: hidden;
  }

  /* KÖZÉP */
  .center {
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }

  input {
    padding: 14px;
    width: 80%;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin: 20px 0;
  }

  /* LUFI */
  .balloons {
    display: flex;
    justify-content: space-around;
    margin-top: 30px;
  }

  .balloon {
    width: 130px;
    height: 170px;
    border-radius: 50% 50% 45% 45%;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s;
  }

  .balloon:hover {
    transform: scale(1.05);
  }

  .balloon::after {
    content: "";
    position: absolute;
    bottom: -35px;
    left: 50%;
    width: 2px;
    height: 35px;
    background: #999;
  }

  .pink {
    background: radial-gradient(circle at 30% 30%, #fff, #ff69b4);
  }

  .blue {
    background: radial-gradient(circle at 30% 30%, #fff, #5dade2);
  }

  /* POP */
  .pop {
    animation: pop 0.4s forwards;
  }

  @keyframes pop {
    to {
      transform: scale(2);
      opacity: 0;
    }
  }

  /* LISTÁK */
  ul {
    list-style: none;
    padding: 0;
    margin-top: 15px;
  }

  li {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }

  /* KONFETTI */
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .loading {
    text-align: center;
    color: #999;
    font-style: italic;
    padding: 20px 0;
  }

  .mobile-loading {
    width: 100%;
    display: none;
    text-align: center;
    margin: 16px 0 0px;
    font-style: italic;
    color: #888;
    min-height: 40px;
  }

  /* MOBIL GOMBOK – ALAP */
  .mobile-buttons {
    display: none;
  }

  @media (max-width: 900px) {
    .mobile-loading {
      display: block;
    }
  }

  /* MOBIL */
  @media (max-width: 900px) {

    canvas {
      position: absolute;
    }

    .counts {
      margin: 8px 0;
    }

    body {
      overscroll-behavior-y: auto;
    }

    

    input {
      margin: 8px 0;
    }

    .balloons {
      margin-bottom: 32px;
    }

    .box.center input {
      align-self: center;
    }

    .box:nth-child(1) {
      grid-area: girl;
    }

    .box:nth-child(3) {
      grid-area: boy;
    }

    /* mobilon elrejtjük az oldalsó boxokat */
    .wrapper > .box:not(.center) {
      display: none !important;
    }

    /* mobilos gombok */
    .mobile-buttons {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      margin-bottom: 0px;
      flex-shrink: 0;
    }
  }

  .mobile-buttons button {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    white-space: nowrap;
    text-align: center;
  }

  .mobile-buttons button:first-child {
    background: #ff69b4;
  }

  .mobile-buttons button:last-child {
    background: #5dade2;
  }

  .counts {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    align-items: center;
  }

  .count {
    font-size: 28px;
    font-weight: 700;
  }

  .pink-text {
    color: #ff69b4;
  }

  .blue-text {
    color: #5dade2;
  }

  /* POPUP */
  .popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .popup-content {
    background: white;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    width: 90%;
    max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }

  .popup-content h2 {
    margin-top: 0;
    font-size: 26px;
  }

  .popup-content button {
    margin-top: 25px;
    padding: 14px 30px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff69b4, #5dade2);
    color: white;
  }

@media (max-width: 900px) {

  html, body {
    height: 100%;
    overflow: hidden;
  }

  .wrapper {
    height: 100svh;
    display: flex;
    justify-content: center;
    align-items: stretch;
    padding: 16px;
    overflow: hidden;
  }

  .box.center {
    width: 100%;
    max-width: 500px;
    height: 100%;
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: hidden;
  }

  .center-inner {
    width: 100%;
  }

  /* oldalsó boxok eltüntetése */
  .wrapper > .box:not(.center) {
    display: none !important;
  }

  .mobile-buttons {
    display: flex;
    gap: 16px;
    margin-top: 8px;
  }
}
  /* Nevek 2 oszlopban (asztali + popup) */
#girlList,
#boyList,
#tipsContent {
  column-count: 2;
  column-gap: 24px;
}

#girlList li,
#boyList li,
#tipsContent li {
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
}


</style>


<script src="./config.js"></script>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="wrapper">

    <!-- LÁNY -->
    <div class="box">
        <h2 style="color:#ff69b4">💗 Lány tippek</h2>
        <ul id="girlList"></ul>
    </div>
    

    <!-- KÖZÉP -->
  <div class="box center">
  <div class="center-inner">

    <h1>🎉 Babaváró buli 🎉</h1>
    <p>Tippeld meg a baba nemét! Töltsd ki a neved, és kattints a lufira!</p>

    <input type="text" id="name" placeholder="Add meg a neved">

    <div class="balloons">
      <div class="balloon pink" onclick="vote('kislány', this)"></div>
      <div class="balloon blue" onclick="vote('kisfiú', this)"></div>
    </div>

    <!-- ✅ SZÁMLÁLÓK -->
    <div class="counts">
      <div class="count pink-text">
        💗 <span id="girlCount">0</span>
      </div>
      <div class="count blue-text">
        💙 <span id="boyCount">0</span>
      </div>

      <p id="mobileLoading" class="mobile-loading">
        ⏳ Pillanat… betöltődnek a tippjeitek!
      </p>
    </div>

    <!-- ✅ MOBIL GOMBOK -->
    <div class="mobile-buttons">
      <button onclick="openTips('girl')">💗 Lány tippek</button>
      <button onclick="openTips('boy')">💙 Fiú tippek</button>
    </div>

    <p id="message"></p>

  </div>
</div>

        <!-- FIÚ -->
    <div class="box">
        <h2 style="color:#5dade2">💙 Fiú tippek</h2>
        <ul id="boyList"></ul>
    </div>

  
</div>
    
  <!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
    <button onclick="closePopup()">Tovább</button>
  </div>
</div>
    <div id="tipsPopup" class="popup">
  <div class="popup-content">
    <h2 id="tipsTitle"></h2>
    <ul id="tipsContent"></ul>
    <button onclick="closeTips()">Bezárás</button>
  </div>
</div>



<script>
const API_URL = window.APP_CONFIG.API_URL;


/* ===== KONFETTI ===== */
let canvas, ctx;

document.addEventListener("DOMContentLoaded", () => {
  canvas = document.getElementById("confetti");
  ctx = canvas.getContext("2d");
  resizeCanvas();
  renderLists();
});

let confetti = [];

function createConfetti(color) {
    for (let i = 0; i < 120; i++) {
        confetti.push({
            x: Math.random() * canvas.width,
            y: -10,
            size: Math.random() * 6 + 4,
            speed: Math.random() * 4 + 2,
            color
        });
    }
    animateConfetti();
}

function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confetti.forEach((p, i) => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.y += p.speed;
        if (p.y > canvas.height) confetti.splice(i, 1);
    });
    if (confetti.length > 0) requestAnimationFrame(animateConfetti);
}

/* ===== LISTÁK BETÖLTÉSE SHEETS-BŐL ===== */
function renderLists() {
    const girl = document.getElementById("girlList");
    const boy = document.getElementById("boyList");
    const mobileLoading = document.getElementById("mobileLoading");
if (mobileLoading) mobileLoading.style.display = "block";


    // ⏳ BETÖLTÉS JELZÉS
    girl.innerHTML = `<li class="loading">⏳ Pillanat…<br>betöltődnek a tippjeitek!</li>`;
    boy.innerHTML = `<li class="loading">⏳ Pillanat…<br>betöltődnek a tippjeitek!</li>`;

    fetch(API_URL)
        .then(r => r.json())
        .then(tips => {
            girl.innerHTML = "";
            boy.innerHTML = "";

            let girlCounter = 0;
            let boyCounter = 0;

            tips
              .filter(t => t.name && t.choice)
              .forEach(t => {
                const li = document.createElement("li");
                li.textContent = t.name;

                if (t.choice === "kislány") {
                    girl.appendChild(li);
                    girlCounter++;
                } else if (t.choice === "kisfiú") {
                    boy.appendChild(li);
                    boyCounter++;
                }
              });

            document.getElementById("girlCount").innerText = girlCounter;
            document.getElementById("boyCount").innerText = boyCounter;

            if (mobileLoading) {
  if (window.innerWidth <= 900) {
    mobileLoading.innerText =
      "👀 Ha kíváncsi vagy, kattints a gombokra 👇";
  } else {
    mobileLoading.innerText = "";
  }
}


        })
        .catch(() => {
            girl.innerHTML = `<li class="loading">😕 Nem sikerült betölteni</li>`;
            boy.innerHTML = `<li class="loading">😕 Nem sikerült betölteni</li>`;
            mobileLoading.innerText = "😕 Nem sikerült betölteni a tippeket";

        });
}


/* ===== SZAVAZÁS ===== */
function vote(choice, balloon) {
  const nameInput = document.getElementById("name");
  const name = nameInput.value.trim();
  if (!name) return alert("Add meg a neved!");

  // 🎉 1. AZONNALI UI VISSZAJELZÉS
  const color = choice === "kislány" ? "#ff69b4" : "#5dade2";

  balloon.classList.add("pop");
  createConfetti(color);

  document.getElementById("popupTitle").innerText =
    choice === "kislány" ? "💗 Kislányra szavaztál!" : "💙 Kisfiúra szavaztál!";
  document.getElementById("popupText").innerText = `Köszönjük, ${name}!`;


  setTimeout(() => {
    document.querySelectorAll(".balloon").forEach(b => b.classList.remove("pop"));
  }, 400);

  // 📡 2. ADATKÜLDÉS HÁTTÉRBEN
fetch(API_URL, {
  method: "POST",
  body: new URLSearchParams({
    name: name,
    choice: choice
  })
})

.then(async r => {
  const text = await r.text();
  try {
    return JSON.parse(text);
  } catch {
    throw new Error("Nem JSON válasz: " + text);
  }
})
.then(res => {
  if (res.id) {
    sessionStorage.setItem("voteId", res.id);
    renderLists();
    document.getElementById("popup").style.display = "flex";
  } else {
    alert(res.message || "Mentési hiba");
  }
})
.catch(err => {
  console.error(err);
  alert("API hiba 😕");
});

}

/* INIT */

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// csak valódi orientációváltáskor
window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 300);
});


function closePopup() {
  const id = sessionStorage.getItem("voteId");
  if (!id) {
    alert("Hiányzó azonosító. Szavazz újra kérlek!");
    return;
  }
  window.location.href =
    "https://attilabekecs.github.io/genderrevealparty/mikorszuletikababa.html?id=" + encodeURIComponent(id);
}

function openTips(type) {
    const title = document.getElementById("tipsTitle");
    const content = document.getElementById("tipsContent");

    title.innerText = type === "girl" ? "💗 Lány tippek" : "💙 Fiú tippek";

    const sourceList = type === "girl"
        ? document.getElementById("girlList")
        : document.getElementById("boyList");

    content.innerHTML = sourceList.innerHTML || "<li>Még nincs tipp</li>";

    document.getElementById("tipsPopup").style.display = "flex";
}

function closeTips() {
    document.getElementById("tipsPopup").style.display = "none";
}


</script>

</body>
</html>
