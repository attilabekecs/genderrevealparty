<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Időkapszula – utolsó üzenet</title>

<script src="config.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #fff1f7, #eef5ff);
    min-height: 100vh;
    padding: 30px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: white;
    border-radius: 30px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

h1, p {
    text-align: center;
}

textarea {
    width: 100%;
    resize: none;
    min-height: 160px;
    padding: 18px;
    border-radius: 18px;
    border: 1px solid #ccc;
    font-size: 15px;
    font-family: inherit;
    margin-top: 30px;
}

button {
    display: block;
    margin: 30px auto 0;
    padding: 16px 40px;
    border-radius: 999px;
    border: none;
    font-size: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff9bd0, #7fbce8);
    color: white;
}
/* =========================
   💖 KÖSZÖNŐ MODAL
   ========================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.modal.hidden {
  display: none;
}

.modal-content {
  background: white;
  border-radius: 26px;
  padding: 32px 26px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  animation: modalIn 0.3s ease;
}

.modal-emoji {
  font-size: 42px;
  margin-bottom: 10px;
}

.modal-content h2 {
  margin: 0 0 10px;
  font-size: 22px;
}

.modal-content p {
  font-size: 15px;
  line-height: 1.5;
  color: #444;
  margin-bottom: 24px;
}

.modal-content button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, #ff9bd0, #7fbce8);
  color: white;
}

@keyframes modalIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}


/* =========================
   📱 MOBIL OPTIMALIZÁLÁS
   ========================= */
@media (max-width: 600px) {

  body {
  padding: 10px;
  display: block;      /* ❗ NE flex legyen */
}

 .container {
  width: 100%;
  border-radius: 22px;      /* visszajön a kártya hatás */
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  padding: 26px 18px 30px;
}



  h1 {
    font-size: 22px;
    line-height: 1.3;
  }

  p {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  textarea {
    min-height: 180px;
    font-size: 16px; /* 🔑 iOS zoom elkerülés */
    line-height: 1.5;
    border-radius: 16px;
    padding: 16px;
    margin-top: 22px;
  }

  textarea::placeholder {
    font-size: 15px;
  }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
  }

  button:active {
    transform: scale(0.97);
  }
}
    @media (max-width: 600px) {

  .modal {
    align-items: flex-end; /* ⬇️ alulról jön fel */
  }

  .modal-content {
    max-width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 28px 22px 32px;
    animation: modalUp 0.35s ease;
  }

  @keyframes modalUp {
    from {
      transform: translateY(100%);
    }
    to {
      transform: translateY(0);
    }
  }
}


</style>
</head>

<body>

<div class="container">
    <h1>🕰️ Időkapszula</h1>
    <p>
        Ez az üzenet egy különleges pillanat lenyomata.<br>
        <em>Elraktározzuk a jövőnek.</em>
    </p>

    <textarea id="message"
        placeholder="Amikor megszülettél, ezt szeretném, ha tudnád…"></textarea>

    <button id="send">Elteszem az időkapszulába</button>
</div>
<!-- ✅ KÖSZÖNŐ MODAL -->
<div id="thankYouModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-emoji">💖</div>
    <h2>Köszönjük!</h2>
    <p>
      Köszönjük, hogy végig kitöltötted ezt a pár oldalt.<br>
      Az üzenetedet elraktuk az időkapszulába.
    </p>
    <button id="closeModal">Bezár</button>
  </div>
</div>

<script>
function getUserId() {
  // 1️⃣ URL query (?id=...)
  const q = new URLSearchParams(window.location.search).get("id");
  if (q) return q;

  // 2️⃣ URL hash (#id=...)
  const h = new URLSearchParams(
    (window.location.hash || "").replace(/^#/, "")
  ).get("id");
  if (h) return h;

  // 3️⃣ localStorage fallback
  const ls = localStorage.getItem("userId");
  if (ls) return ls;

  return null;
}

document.getElementById("send").onclick = async () => {
  const text = document.getElementById("message").value.trim();
  const userId = getUserId();

  if (!text) {
    alert("Kérlek, írj egy üzenetet.");
    return;
  }

  if (!userId) {
    alert("Hiányzó azonosító.");
    return;
  }

  // 🔐 eltesszük, hogy később is biztos meglegyen
  localStorage.setItem("userId", userId);

  try {
    await fetch(window.APP_CONFIG.API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: userId,
        message: text
      })
    });

    document.getElementById("message").value = "";
    document.getElementById("thankYouModal").classList.remove("hidden");


  } catch (err) {
    console.error(err);
    alert("Hiba történt az elküldés során.");
  }
};

document.getElementById("closeModal").onclick = () => {
  window.location.href = "miababaneme.html"; // ⬅️ első oldal
};


</script>

</body>
</html>
